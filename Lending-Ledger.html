<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lending Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ledger book. Sticky period bar on top, two columns (people + ledger) that stack on phones. */
:root{
  --bg:#F3F5F2; --paper:#FFFFFF; --ink:#16201C; --muted:#56635D; --rule:#D9E0DB; --rule-strong:#B7C2BB;
  --accent:#1E5B48; --accent-ink:#FFFFFF; --accent-soft:#E2EEE8;
  --lent:#A64B12; --lent-soft:#FBEDE2; --repaid:#22529B; --repaid-soft:#E4ECF8;
  --danger:#A3242A;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --paper:#161E1B; --ink:#E6ECE8; --muted:#9AA8A1; --rule:#26312D; --rule-strong:#3A4842;
  --accent:#5FBF9C; --accent-ink:#06120D; --accent-soft:#1A2E27;
  --lent:#F0A06A; --lent-soft:#33221A; --repaid:#8DB4F2; --repaid-soft:#1A2436;
  --danger:#F08A8E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --paper:#161E1B; --ink:#E6ECE8; --muted:#9AA8A1; --rule:#26312D; --rule-strong:#3A4842;
  --accent:#5FBF9C; --accent-ink:#06120D; --accent-soft:#1A2E27;
  --lent:#F0A06A; --lent-soft:#33221A; --repaid:#8DB4F2; --repaid-soft:#1A2436;
  --danger:#F08A8E; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:10px}
.brand svg{color:var(--accent)}
.spacer{flex:1}
.yearpick{display:flex;align-items:center;gap:4px}
.icon-btn{width:40px;height:40px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:var(--accent-soft)}
.year{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:64px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.months{display:flex;gap:4px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
.months button{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:500;color:var(--muted);position:relative}
.months button:hover{border-color:var(--rule-strong);color:var(--ink)}
.months button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.months button .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.months button[aria-current="true"] .dot{background:var(--paper)}

.notice{margin-top:16px;padding:10px 14px;border-radius:8px;background:var(--lent-soft);color:var(--ink);font-size:14px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-block:20px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.stat .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:500;margin-top:2px}
.stat.lent .val{color:var(--lent)} .stat.repaid .val{color:var(--repaid)}
.stat.owed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.owed .lbl{color:var(--accent-ink);opacity:.85}
.stat.owe{background:var(--repaid);border-color:var(--repaid);color:var(--paper)}
.stat.owe .lbl{color:var(--paper);opacity:.85}

.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start;padding-bottom:48px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.card-h h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;flex:1}
.card-b{padding:16px}

.addperson{display:flex;gap:8px}
.addperson input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--rule-strong);background:var(--bg);border-radius:8px;padding:9px 11px;min-height:42px;width:100%}
textarea{resize:vertical;min-height:42px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;min-height:42px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}

.people{list-style:none;margin:0;padding:0}
.people li{border-top:1px solid var(--rule)}
.people li:first-child{border-top:0}
.person{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:transparent;border:0;text-align:left;min-height:52px}
.person:hover{background:var(--accent-soft)}
.person[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--rule);flex:0 0 auto}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pbal{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.pbal.pos{color:var(--lent)} .pbal.zero{color:var(--muted)} .pbal.neg{color:var(--repaid)}
.ptag{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}

.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:16px;border-bottom:1px solid var(--rule);background:var(--bg);border-radius:12px 12px 0 0}
.form .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.form label,.fl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.f.type-f{grid-column:1 / -1}.f.person-f{grid-column:span 2}.f.amt-f{grid-column:span 2}
.f.date-f{grid-column:span 2}.f.note-f{grid-column:span 5}.f.act-f{grid-column:span 1;justify-content:flex-end}
@media (max-width:620px){.form .f{grid-column:1 / -1 !important}}
.type-toggle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule-strong);border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden}
@media (max-width:620px){.type-toggle{grid-template-columns:repeat(2,minmax(0,1fr))}}
.type-toggle button{border:0;background:var(--paper);font-weight:600;color:var(--muted);min-height:42px;padding:6px 8px}
.type-toggle button[aria-pressed="true"][data-d="lent"]{background:var(--lent);color:#fff}
.type-toggle button[aria-pressed="true"][data-d="repaid"]{background:var(--repaid);color:#fff}
:root[data-theme="dark"] .type-toggle button[aria-pressed="true"]{color:#0F1513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .type-toggle button[aria-pressed="true"]{color:#0F1513}}
.form-msg{grid-column:1 / -1;font-size:13px;color:var(--danger);min-height:0}
.form-msg:empty{display:none}
.editing-bar{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}

.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:hover td{background:var(--bg)}
td.r,th.r{text-align:right}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.chip.lent{background:var(--lent-soft);color:var(--lent)}
.chip.repaid{background:var(--repaid-soft);color:var(--repaid)}
.amt.lent{color:var(--lent)} .amt.repaid{color:var(--repaid)}
.note{color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.rowact button{border:0;background:transparent;width:34px;height:34px;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.rowact button:hover{background:var(--accent-soft);color:var(--ink)}
.rowact button.del:hover{color:var(--danger)}
tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--rule-strong)}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}

.filterbar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--accent-soft);font-size:14px;flex-wrap:wrap}

.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:140px;padding:16px 16px 0}
.bar{display:flex;gap:2px;align-items:flex-end;height:100%;justify-content:center}
.bar i{display:block;width:40%;max-width:14px;border-radius:3px 3px 0 0;min-height:1px}
.bar i.l{background:var(--lent)} .bar i.r{background:var(--repaid)}
.barlbl{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;padding:6px 16px 4px;font-size:11px;color:var(--muted);text-align:center}
.legend{display:flex;gap:16px;padding:6px 16px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .l::before{background:var(--lent)} .legend .r::before{background:var(--repaid)}
tr.clickable{cursor:pointer}

.backup{display:flex;flex-direction:column;gap:8px}
.backup p{margin:0 0 4px;font-size:13px;color:var(--muted)}
.backup .row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:13px}
@media (prefers-reduced-motion:no-preference){.person,.months button,.btn{transition:background .15s, color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1 class="brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Lending Ledger</h1>
      <div class="spacer"></div>
      <div class="yearpick">
        <button class="icon-btn" id="prevYear" aria-label="Previous year"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span class="year num" id="yearLbl" aria-live="polite">2026</span>
        <button class="icon-btn" id="nextYear" aria-label="Next year"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="vMonth" aria-pressed="true">Month</button>
        <button id="vYear" aria-pressed="false">Year</button>
      </div>
    </div>
    <nav class="months" id="months" aria-label="Months"></nav>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice" hidden></div>
  <section class="summary" id="summary" aria-label="Totals"></section>

  <div class="grid">
    <aside style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <section class="card" aria-labelledby="peopleH">
        <div class="card-h"><h2 id="peopleH">People</h2><span class="fl">Balance</span></div>
        <div class="card-b" style="padding-bottom:12px">
          <form class="addperson" id="addPersonForm">
            <label class="sr" for="newPerson">Name</label>
            <input type="text" id="newPerson" placeholder="Add a name" maxlength="60" autocomplete="off">
            <button class="btn" type="submit">Add</button>
          </form>
        </div>
        <ul class="people" id="people"></ul>
      </section>

      <section class="card" aria-labelledby="backupH">
        <div class="card-h"><h2 id="backupH">Backup</h2></div>
        <div class="card-b backup">
          <p>Your records are saved in this browser on this device only. Clearing browser data erases them, so download a backup regularly. You can restore it here or on another device.</p>
          <div class="row">
            <button class="btn ghost small" id="expCsv">Download CSV</button>
            <button class="btn ghost small" id="expJson">Download backup</button>
          </div>
          <label class="btn ghost small" for="impFile" style="text-align:center;display:inline-flex;align-items:center;justify-content:center;width:max-content">Restore from backup</label>
          <input type="file" id="impFile" accept=".json,application/json" class="sr">
        </div>
      </section>
    </aside>

    <section class="card" id="mainCard" aria-live="polite"></section>
  </div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const fmt=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
  const money=n=>fmt.format(Math.round(n*100)/100);
  const now=new Date();
  const S={people:new Map(),months:new Map(),year:now.getFullYear(),month:now.getMonth(),view:"month",
    filter:null,type:"lent",editing:null,confirmDel:null,confirmPerson:null,db:null,dl:null,ready:false};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ymOf=(y,m)=>y+"-"+String(m+1).padStart(2,"0");
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
  const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

  // ---------- data helpers ----------
  const allEntries=()=>{const a=[];S.months.forEach(list=>list.forEach(e=>a.push(e)));return a};
  // lent / ipaid = money going out (raises what they owe you); repaid / borrowed = money coming in
  const OUT=new Set(["lent","ipaid"]);
  const TYPES=["lent","repaid","borrowed","ipaid"];
  const TL={lent:"I lent",repaid:"They paid me",borrowed:"I borrowed",ipaid:"I paid them"};
  const dir=t=>OUT.has(t)?"lent":"repaid";
  const signed=e=>OUT.has(e.type)?e.amount:-e.amount;
  function balances(){const b=new Map();S.people.forEach((_,id)=>b.set(id,0));allEntries().forEach(e=>b.set(e.personId,(b.get(e.personId)||0)+signed(e)));return b}
  const pname=id=>S.people.get(id)?.name||"Removed person";
  function monthEntries(y,m){return (S.months.get(ymOf(y,m))||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0))}
  function totals(list){let l=0,r=0;list.forEach(e=>OUT.has(e.type)?l+=e.amount:r+=e.amount);return{l,r}}

  // ---------- storage ----------
  const KEY="lendingLedger.v1";
  function persist(){
    const months={};S.months.forEach((l,k)=>{if(l.length)months[k]=l});
    const people={};S.people.forEach((p,k)=>people[k]=p);
    localStorage.setItem(KEY,JSON.stringify({people,months,savedAt:Date.now()}));
  }
  function load(){
    try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(!d)return;
      Object.entries(d.people||{}).forEach(([k,p])=>p&&p.name&&S.people.set(k,{name:p.name}));
      Object.entries(d.months||{}).forEach(([k,l])=>Array.isArray(l)&&S.months.set(k,l));
    }catch(e){console.error(e)}
  }
  async function writeMonth(ym,list){
    S.months.set(ym,list);persist();
  }
  async function saveEntry(entry,prevYm){
    const ym=entry.date.slice(0,7);
    if(prevYm&&prevYm!==ym){await writeMonth(prevYm,(S.months.get(prevYm)||[]).filter(e=>e.id!==entry.id))}
    const list=(S.months.get(ym)||[]).filter(e=>e.id!==entry.id);list.push(entry);
    await writeMonth(ym,list);
  }
  async function deleteEntry(id){
    for(const [ym,list] of S.months){if(list.some(e=>e.id===id)){await writeMonth(ym,list.filter(e=>e.id!==id));return}}
  }
  async function savePerson(id,name){
    S.people.set(id,{name});persist();
  }
  async function removePerson(id){
    S.people.delete(id);persist();
  }
  const fail=e=>{console.error(e);toast("Couldn't save in this browser. Private browsing mode may block saving; download a backup now.")};

  // ---------- render ----------
  function render(){
    $("yearLbl").textContent=S.year;
    $("vMonth").setAttribute("aria-pressed",S.view==="month");$("vYear").setAttribute("aria-pressed",S.view==="year");
    renderMonths();renderSummary();renderPeople();
    // keep whatever is typed in the form when live data refreshes the page
    const key=S.view+"|"+ymOf(S.year,S.month)+"|"+(S.editing?S.editing.id:"");
    const ids=["fPerson","fNewName","fAmt","fDate","fNote"];
    const kept=(!S.resetForm&&S.formKey===key)?ids.map(i=>$(i)?$(i).value:null):null;
    const focus=document.activeElement&&document.activeElement.id;
    S.resetForm=false;S.formKey=key;
    S.view==="month"?renderMonthView():renderYearView();
    if(kept){ids.forEach((i,k)=>{const el=$(i);if(el&&kept[k]!==null){if(el.tagName!=="SELECT"||[...el.options].some(o=>o.value===kept[k]))el.value=kept[k]}});
      const n=$("fNewName"),p=$("fPerson");if(n&&p)n.hidden=p.value!=="__new";}
    if(focus&&ids.includes(focus)&&$(focus))$(focus).focus();
  }
  function renderMonths(){
    const nav=$("months");
    nav.innerHTML=MONTHS.map((m,i)=>{
      const has=(S.months.get(ymOf(S.year,i))||[]).length>0;
      const cur=S.view==="month"&&i===S.month;
      return `<button data-m="${i}" aria-current="${cur}">${m}${has?'<span class="dot" aria-hidden="true"></span>':''}${has?'<span class="sr"> (has records)</span>':''}</button>`}).join("");
  }
  function renderSummary(){
    let list;let label;
    if(S.view==="month"){list=monthEntries(S.year,S.month);label=MONTHS_FULL[S.month]+" "+S.year}
    else{list=[];for(let i=0;i<12;i++)list.push(...monthEntries(S.year,i));label="All of "+S.year}
    if(S.filter)list=list.filter(e=>e.personId===S.filter);
    const t=totals(list);
    const bal=balances();let owed=0,owe=0;
    (S.filter?[bal.get(S.filter)||0]:[...bal.values()]).forEach(v=>{if(v>0)owed+=v;else owe-=v});
    const who=S.filter?esc(pname(S.filter)):"";
    $("summary").innerHTML=`
      <div class="stat lent"><div class="lbl">Money out · ${esc(label)}</div><div class="val">${money(t.l)}</div></div>
      <div class="stat repaid"><div class="lbl">Money in · ${esc(label)}</div><div class="val">${money(t.r)}</div></div>
      <div class="stat owed"><div class="lbl">${S.filter?who+" owes you":"Owed to you"}</div><div class="val">${money(owed)}</div></div>
      <div class="stat owe"><div class="lbl">${S.filter?"You owe "+who:"You owe"}</div><div class="val">${money(owe)}</div></div>`;
  }
  function renderPeople(){
    const bal=balances();
    const ul=$("people");
    if(!S.people.size){ul.innerHTML=`<li class="empty" style="padding:20px 16px"><strong>No one yet</strong>Add the people you lend money to.</li>`;return}
    const arr=[...S.people.entries()].sort((a,b)=>(bal.get(b[0])||0)-(bal.get(a[0])||0)||a[1].name.localeCompare(b[1].name));
    ul.innerHTML=arr.map(([id,p])=>{
      const v=bal.get(id)||0;const cls=v>0.004?"pos":v<-0.004?"neg":"zero";
      const tag=v>0.004?"owes you":v<-0.004?"you owe":"settled";
      return `<li><button class="person" data-pid="${id}" aria-pressed="${S.filter===id}">
        <span class="avatar" aria-hidden="true">${esc(initials(p.name))}</span>
        <span class="pname">${esc(p.name)}</span>
        <span class="pbal ${cls}" style="text-align:right">${money(Math.abs(v))}<span class="ptag">${tag}</span></span>
      </button></li>`}).join("");
  }
  function personOptions(sel){
    const opts=[...S.people.entries()].sort((a,b)=>a[1].name.localeCompare(b[1].name));
    return `<option value="">Choose…</option>`+opts.map(([id,p])=>`<option value="${id}"${id===sel?" selected":""}>${esc(p.name)}</option>`).join("")+`<option value="__new">+ New person…</option>`;
  }
  function filterBar(){
    if(!S.filter)return"";
    const bal=balances().get(S.filter)||0;
    return `<div class="filterbar"><span>Showing only <strong>${esc(pname(S.filter))}</strong></span><span class="spacer"></span>
      ${bal>0.004?`<button class="btn small" data-act="settle">Mark ${money(bal)} paid back to you</button>`:bal<-0.004?`<button class="btn small" data-act="settle">Mark ${money(-bal)} paid to them</button>`:""}
      ${S.confirmPerson===S.filter?`<span class="confirm">Remove ${esc(pname(S.filter))}?<button class="btn danger small" data-act="rmperson-yes">Remove</button><button class="btn ghost small" data-act="rmperson-no">Keep</button></span>`:`<button class="btn ghost small" data-act="rmperson">Remove person</button>`}
      <button class="btn ghost small" data-act="clearfilter">Show everyone</button></div>`;
  }
  function renderMonthView(){
    const ed=S.editing;
    const list=monthEntries(S.year,S.month).filter(e=>!S.filter||e.personId===S.filter);
    const defDate=ed?ed.date:(S.year===now.getFullYear()&&S.month===now.getMonth()?todayISO():ymOf(S.year,S.month)+"-01");
    const type=ed?ed.type:S.type;
    const rows=list.map(e=>S.confirmDel===e.id?
      `<tr><td colspan="6"><div class="confirm">Delete "${TL[e.type]||e.type} ${money(e.amount)}" for ${esc(pname(e.personId))}?
        <button class="btn danger small" data-act="del-yes" data-id="${e.id}">Delete</button><button class="btn ghost small" data-act="del-no">Cancel</button></div></td></tr>`:
      `<tr><td class="num" style="white-space:nowrap">${e.date.slice(5,7)}/${e.date.slice(8,10)}</td>
        <td style="font-weight:500">${esc(pname(e.personId))}</td>
        <td><span class="chip ${dir(e.type)}">${TL[e.type]||e.type}</span></td>
        <td class="r num amt ${dir(e.type)}">${money(e.amount)}</td>
        <td class="note" title="${esc(e.note)}">${esc(e.note)||""}</td>
        <td><div class="rowact">
          <button data-act="edit" data-id="${e.id}" aria-label="Edit entry"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="del" data-act="del" data-id="${e.id}" aria-label="Delete entry"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
        </div></td></tr>`).join("");
    const t=totals(list);
    $("mainCard").innerHTML=`
      <form class="form" id="entryForm" novalidate>
        ${ed?`<div class="editing-bar">Editing an entry · <button type="button" class="btn ghost small" data-act="cancel-edit">Cancel edit</button></div>`:""}
        <div class="f type-f"><span class="fl" id="typeLbl">What happened</span><div class="type-toggle" role="group" aria-labelledby="typeLbl">
          ${TYPES.map(t=>`<button type="button" data-t="${t}" data-d="${dir(t)}" aria-pressed="${type===t}">${TL[t]}</button>`).join("")}</div></div>
        <div class="f person-f"><label for="fPerson">Person</label><select id="fPerson">${personOptions(ed?ed.personId:(S.filter||S.lastPerson||""))}</select>
          <input type="text" id="fNewName" placeholder="New person's name" maxlength="60" hidden></div>
        <div class="f amt-f"><label for="fAmt">Amount (USD)</label><input type="number" id="fAmt" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" value="${ed?ed.amount:""}" class="num"></div>
        <div class="f date-f"><label for="fDate">Date</label><input type="date" id="fDate" value="${defDate}"></div>
        <div class="f note-f"><label for="fNote">Note (optional)</label><input type="text" id="fNote" maxlength="200" placeholder="e.g. rent share, groceries" value="${esc(ed?ed.note:"")}"></div>
        <div class="f act-f"><button class="btn" type="submit">${ed?"Save":"Add"}</button></div>
        <div class="form-msg" id="formMsg" role="alert"></div>
      </form>
      ${filterBar()}
      <div class="card-h"><h2>${MONTHS_FULL[S.month]} ${S.year}</h2><span class="fl">${list.length} ${list.length===1?"entry":"entries"}</span></div>
      ${list.length?`<div class="tablebox"><table>
        <thead><tr><th>Date</th><th>Person</th><th>Type</th><th class="r">Amount</th><th>Note</th><th><span class="sr">Actions</span></th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="3">Money out minus money in</td><td class="r num">${money(t.l-t.r)}</td><td colspan="2" style="color:var(--muted);font-weight:400">${money(t.l)} out, ${money(t.r)} in</td></tr></tfoot>
      </table></div>`:`<div class="empty">${S.ready?`<strong>Nothing recorded for ${MONTHS_FULL[S.month]}</strong>Use the form above to log money you lent, borrowed or paid back.`:`<strong>Loading your ledger…</strong>Your saved records will appear here.`}</div>`}`;
  }
  function renderYearView(){
    const per=[];let max=0;
    for(let i=0;i<12;i++){const l=monthEntries(S.year,i).filter(e=>!S.filter||e.personId===S.filter);const t=totals(l);per.push({...t,n:l.length});max=Math.max(max,t.l,t.r)}
    const yt=per.reduce((a,b)=>({l:a.l+b.l,r:a.r+b.r,n:a.n+b.n}),{l:0,r:0,n:0});
    const h=v=>max?Math.max(v>0?2:0,v/max*100):0;
    // per person for this year
    const pp=new Map();
    for(let i=0;i<12;i++)monthEntries(S.year,i).forEach(e=>{const o=pp.get(e.personId)||{l:0,r:0};OUT.has(e.type)?o.l+=e.amount:o.r+=e.amount;pp.set(e.personId,o)});
    const balTxt=v=>v>0.004?money(v)+" owes you":v<-0.004?"you owe "+money(-v):"settled";
    const ppRows=[...pp.entries()].filter(([id])=>!S.filter||id===S.filter).sort((a,b)=>b[1].l-a[1].l);
    $("mainCard").innerHTML=`
      ${filterBar()}
      <div class="card-h"><h2>${S.year} by month</h2><span class="fl">${yt.n} entries</span></div>
      <div class="bars" role="img" aria-label="Amount lent and paid back each month of ${S.year}">
        ${per.map(p=>`<div class="bar"><i class="l" style="height:${h(p.l)}%"></i><i class="r" style="height:${h(p.r)}%"></i></div>`).join("")}
      </div>
      <div class="barlbl" aria-hidden="true">${MONTHS.map(m=>`<span>${m[0]}<span class="sr">${m}</span></span>`).join("")}</div>
      <div class="legend"><span class="l">Money out</span><span class="r">Money in</span>${max?`<span style="margin-left:auto">Tallest bar: ${money(max)}</span>`:""}</div>
      <div class="tablebox"><table>
        <thead><tr><th>Month</th><th class="r">Money out</th><th class="r">Money in</th><th class="r">Net</th><th class="r">Entries</th></tr></thead>
        <tbody>${per.map((p,i)=>`<tr class="clickable" data-open="${i}" tabindex="0"><td>${MONTHS_FULL[i]}</td><td class="r num amt lent">${p.l?money(p.l):"–"}</td><td class="r num amt repaid">${p.r?money(p.r):"–"}</td><td class="r num">${p.n?money(p.l-p.r):"–"}</td><td class="r num">${p.n||"–"}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>${S.year} total</td><td class="r num">${money(yt.l)}</td><td class="r num">${money(yt.r)}</td><td class="r num">${money(yt.l-yt.r)}</td><td class="r num">${yt.n}</td></tr></tfoot>
      </table></div>
      <div class="card-h" style="border-top:1px solid var(--rule)"><h2>${S.year} by person</h2></div>
      ${ppRows.length?`<div class="tablebox"><table>
        <thead><tr><th>Person</th><th class="r">Out in ${S.year}</th><th class="r">In in ${S.year}</th><th class="r">Balance now</th></tr></thead>
        <tbody>${ppRows.map(([id,o])=>`<tr><td style="font-weight:500">${esc(pname(id))}</td><td class="r num amt lent">${money(o.l)}</td><td class="r num amt repaid">${money(o.r)}</td><td class="r num">${balTxt(balances().get(id)||0)}</td></tr>`).join("")}</tbody>
      </table></div>`:`<div class="empty"><strong>No records in ${S.year}</strong>Switch to Month view to add entries.</div>`}`;
  }

  // ---------- events ----------
  $("prevYear").onclick=()=>{S.year--;S.editing=null;render()};
  $("nextYear").onclick=()=>{S.year++;S.editing=null;render()};
  $("vMonth").onclick=()=>{S.view="month";render()};
  $("vYear").onclick=()=>{S.view="year";S.editing=null;render()};
  $("months").onclick=e=>{const b=e.target.closest("button[data-m]");if(!b)return;S.month=+b.dataset.m;S.view="month";S.editing=null;S.confirmDel=null;render()};
  $("people").onclick=e=>{const b=e.target.closest("button[data-pid]");if(!b)return;S.filter=S.filter===b.dataset.pid?null:b.dataset.pid;S.confirmPerson=null;render()};
  $("addPersonForm").onsubmit=async e=>{
    e.preventDefault();const inp=$("newPerson");const name=inp.value.trim();if(!name)return;
    if([...S.people.values()].some(p=>p.name.toLowerCase()===name.toLowerCase())){toast(name+" is already on your list");return}
    try{await savePerson(uid(),name);inp.value="";toast("Added "+name);render()}catch(err){fail(err)}
  };
  const main=$("mainCard");
  main.addEventListener("change",e=>{if(e.target.id==="fPerson"){const n=$("fNewName");n.hidden=e.target.value!=="__new";if(!n.hidden)n.focus()}});
  main.addEventListener("keydown",e=>{const tr=e.target.closest("tr[data-open]");if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tr.click()}});
  main.addEventListener("click",async e=>{
    const tb=e.target.closest(".type-toggle button");
    if(tb){S.type=tb.dataset.t;if(S.editing)S.editing.type=tb.dataset.t;main.querySelectorAll(".type-toggle button").forEach(b=>b.setAttribute("aria-pressed",b===tb));return}
    const tr=e.target.closest("tr[data-open]");
    if(tr){S.month=+tr.dataset.open;S.view="month";render();return}
    const b=e.target.closest("[data-act]");if(!b)return;
    const act=b.dataset.act,id=b.dataset.id;
    if(act==="edit"){const en=allEntries().find(x=>x.id===id);if(en){S.editing={...en};render();$("fAmt").focus()}}
    else if(act==="cancel-edit"){S.editing=null;render()}
    else if(act==="del"){S.confirmDel=id;render()}
    else if(act==="del-no"){S.confirmDel=null;render()}
    else if(act==="del-yes"){try{await deleteEntry(id);S.confirmDel=null;toast("Entry deleted");render()}catch(err){fail(err)}}
    else if(act==="clearfilter"){S.filter=null;S.confirmPerson=null;render()}
    else if(act==="settle"){
      const bal=balances().get(S.filter)||0;if(Math.abs(bal)<0.005)return;
      const d=todayISO();
      try{await saveEntry({id:uid(),personId:S.filter,type:bal>0?"repaid":"ipaid",amount:Math.round(Math.abs(bal)*100)/100,date:d,note:"Settled in full",createdAt:Date.now()});
        S.year=+d.slice(0,4);S.month=+d.slice(5,7)-1;toast(pname(S.filter)+" is settled up");render()}catch(err){fail(err)}
    }
    else if(act==="rmperson"){S.confirmPerson=S.filter;render()}
    else if(act==="rmperson-no"){S.confirmPerson=null;render()}
    else if(act==="rmperson-yes"){
      const pid=S.filter;const has=allEntries().some(x=>x.personId===pid);
      if(has){S.confirmPerson=null;toast("Delete this person's entries first, so your history stays complete.");render();return}
      try{await removePerson(pid);S.filter=null;S.confirmPerson=null;toast("Removed");render()}catch(err){fail(err)}
    }
  });
  main.addEventListener("submit",async e=>{
    if(e.target.id!=="entryForm")return;e.preventDefault();
    const msg=$("formMsg");msg.textContent="";
    let pid=$("fPerson").value;const amount=parseFloat($("fAmt").value);const date=$("fDate").value;const note=$("fNote").value.trim();
    const type=S.editing?S.editing.type:S.type;
    if(pid==="__new"){
      const name=$("fNewName").value.trim();if(!name){msg.textContent="Type the new person's name.";return}
      const ex=[...S.people.entries()].find(([,p])=>p.name.toLowerCase()===name.toLowerCase());
      if(ex)pid=ex[0];else{pid=uid();try{await savePerson(pid,name)}catch(err){fail(err);return}}
    }
    if(!pid){msg.textContent="Choose who this is for.";return}
    if(!(amount>0)){msg.textContent="Enter an amount above $0.";return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){msg.textContent="Pick a date.";return}
    const prev=S.editing;
    const entry={id:prev?prev.id:uid(),personId:pid,type,amount:Math.round(amount*100)/100,date,note,createdAt:prev?.createdAt||Date.now()};
    try{
      await saveEntry(entry,prev?prev.date.slice(0,7):null);
      S.lastPerson=pid;S.editing=null;S.resetForm=true;S.year=+date.slice(0,4);S.month=+date.slice(5,7)-1;
      toast(TL[type]+" "+money(entry.amount)+" · "+pname(pid));render();
      const a=$("fAmt");if(a)a.focus();
    }catch(err){fail(err)}
  });

  // ---------- backup ----------
  function csv(){
    const rows=[["Date","Person","Type","Amount (USD)","Note"]];
    allEntries().sort((a,b)=>a.date<b.date?-1:1).forEach(e=>rows.push([e.date,pname(e.personId),TL[e.type]||e.type,e.amount.toFixed(2),e.note||""]));
    return rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\n");
  }
  async function offer(filename,data){
    const type=filename.endsWith(".csv")?"text/csv":"application/json";
    const url=URL.createObjectURL(new Blob([data],{type:type+";charset=utf-8"}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  $("expCsv").onclick=()=>offer("lending-ledger-"+todayISO()+".csv",csv());
  $("expJson").onclick=()=>{
    const months={};S.months.forEach((l,k)=>{if(l.length)months[k]=l});
    const people={};S.people.forEach((p,k)=>people[k]=p);
    offer("lending-ledger-backup-"+todayISO()+".json",JSON.stringify({app:"lending-ledger",version:1,exportedAt:new Date().toISOString(),people,months},null,2));
  };
  $("impFile").onchange=async e=>{
    const f=e.target.files[0];e.target.value="";if(!f)return;
    try{
      const data=JSON.parse(await f.text());
      if(data.app!=="lending-ledger"||!data.people||!data.months)throw new Error("format");
      for(const [id,p] of Object.entries(data.people)){if(!S.people.has(id)&&p&&p.name)await savePerson(id,String(p.name).slice(0,60))}
      let n=0;
      for(const [ym,list] of Object.entries(data.months)){
        if(!/^\d{4}-\d{2}$/.test(ym)||!Array.isArray(list))continue;
        const cur=S.months.get(ym)||[];const ids=new Set(cur.map(x=>x.id));
        const add=list.filter(x=>x&&x.id&&!ids.has(x.id)&&x.amount>0&&TYPES.includes(x.type)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date));
        if(add.length){n+=add.length;await writeMonth(ym,cur.concat(add))}
      }
      toast(n?"Restored "+n+" entries":"Nothing new in that backup");render();
    }catch(err){toast(err.message==="format"?"That file isn't a Lending Ledger backup.":"Couldn't read that file.")}
  };

  // ---------- boot ----------
  load();S.ready=true;
  try{localStorage.setItem(KEY+".test","1");localStorage.removeItem(KEY+".test")}
  catch(e){const n=$("notice");n.hidden=false;n.textContent="This browser is blocking saving (private mode?). Your entries will be lost when you close the page unless you download a backup."}
  // keep tabs in sync if the file is open twice
  window.addEventListener("storage",e=>{if(e.key===KEY){S.people=new Map();S.months=new Map();load();render()}});
  render();
})();
</script>
</body>
</html>
